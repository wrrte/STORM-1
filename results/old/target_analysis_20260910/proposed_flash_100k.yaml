# Proposal for a NEW matched 100k experiment; historical runs used 102000 steps.
# Evaluation seeding and terminal-reward handling must be reviewed before launch.
Task: JointTrainAgent
BasicSettings:
  Seed: 0
  ImageSize: 64
  ReplayBufferOnGPU: true
JointTrainAgent:
  SampleMaxSteps: 100000
  BufferMaxLength: 100000
  BufferWarmUp: 1024
  NumEnvs: 1
  BatchSize: 16
  DemonstrationBatchSize: 4
  BatchLength: 64
  ImagineBatchSize: 1024
  ImagineDemonstrationBatchSize: 256
  ImagineContextLength: 8
  ImagineBatchLength: 16
  TrainDynamicsEverySteps: 1
  TrainAgentEverySteps: 1
  UseDemonstration: false
  SaveEverySteps: 2500
  EvalMode: final_only
  EvalEverySteps: 2500
  EvalStartStep: 0
  EvalEpisodes: 20
  Retrieval:
    enable: true
    batch_size_reduction: retrieved
    trigger_mode: z_score
    threshold: 1.0
    z_score_threshold: 3.5
    anchor_offset: -2
    hash_bits: 10
    hash_sample_mode: probs
    use_pca: true
    max_pca_samples: 100000
    warmup_steps: 50000
    min_warmup_steps: 5000
    dynamic_warmup_target_steps: 20000
    max_warmup_steps: 90000
    ema_alpha: 0.01
    max_bucket_size: 1000000000
    max_anchors: 16
    multiplier: 8
    target: 12
    anchor_weight: 0.12
    max_contexts: 256
    global_rebuild_enable: true
    global_rebuild_threshold: 0.12
    global_rebuild_cooldown: 2000
Models:
  WorldModel:
    InChannels: 3
    TransformerMaxLength: 64
    TransformerHiddenDim: 512
    TransformerNumLayers: 2
    TransformerNumHeads: 8
  Agent:
    NumLayers: 2
    HiddenDim: 512
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4
